<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懋略设计部 · PACK零部件工具库</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--ink:#1c2733;--ink-2:#55647a;--ink-3:#8a97ab;--line:#e3e8ef;
  --brand:#1d4ed8;--brand-dark:#14388f;--side-bg:#141d2e;--side-ink:#aebbd0;
  --must:#c2261f;--must-bg:#fdecea;--rec:#1e7e34;--rec-bg:#e8f5ec;--warn:#b45309;--warn-bg:#fdf3e7;--tip:#1e6f9f;--tip-bg:#e9f4fb;
  --radius:10px;--shadow:0 1px 3px rgba(20,32,54,.08),0 8px 24px rgba(20,32,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
.app{display:flex;min-height:100vh}
/* 侧栏 */
.sidebar{width:268px;flex:0 0 268px;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 14px}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.brand-name{color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:11.5px;color:#7d8aa3;margin-top:1px}
.nav{padding:4px 10px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:2px 0;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item .ico{width:18px;text-align:center}
.nav-group-title{font-size:11px;color:#5d6b83;letter-spacing:2px;padding:14px 12px 4px}
.sidebar-foot{padding:14px 18px;font-size:11px;color:#5d6b83;border-top:1px solid rgba(255,255,255,.07);line-height:1.8}
/* 顶栏 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:16px;cursor:pointer}
.search-wrap{flex:1;position:relative;max-width:720px}
#searchInput{width:100%;padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;outline:none;background:#f8fafc;color:var(--ink)}
#searchInput:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.search-results{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:480px;overflow-y:auto;display:none;z-index:60}
.search-results.open{display:block}
.search-item{display:block;padding:10px 16px;border-bottom:1px solid #f0f3f7;cursor:pointer;color:var(--ink)}
.search-item:hover{background:#f4f7fd}
.search-item:last-child{border-bottom:none}
.search-item .s-title{font-weight:600;font-size:14px}
.search-item .s-doc{font-size:12px;color:var(--brand)}
.search-item .s-snip{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.search-item .s-snip mark{background:#fde68a;border-radius:3px;padding:0 2px}
.search-empty{padding:16px;color:var(--ink-3);font-size:13px}
.ver-pill{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
/* 内容 */
.content{padding:26px 30px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{margin-bottom:20px}
.page-title{font-size:24px;font-weight:800;letter-spacing:.3px}
.page-desc{color:var(--ink-2);font-size:14px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink-2);letter-spacing:1px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .num{font-size:26px;font-weight:800;color:var(--brand)}
.stat .lbl{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.stat.dark{background:var(--side-bg);border-color:var(--side-bg)}
.stat.dark .num{color:#fff;font-size:16px;padding-top:8px}
.stat.dark .lbl{color:#8a97ab}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.doc-card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;cursor:pointer}
.doc-card:hover{transform:translateY(-2px);border-color:#b9cdf5}
.doc-card .dc-ico{font-size:22px}
.doc-card .dc-title{font-size:16px;font-weight:700;margin:6px 0 4px}
.doc-card .dc-sub{font-size:12.5px;color:var(--ink-2);line-height:1.55}
/* 选择器 */
.selector{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.selector .sel-panel{position:sticky;top:78px}
.sel-group{margin-bottom:14px}
.sel-group .sg-label{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px;letter-spacing:1px}
.part-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part-btn{border:1.5px solid var(--line);background:#fbfcfe;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;color:var(--ink);transition:all .12s}
.part-btn:hover{border-color:#b9cdf5}
.part-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.sel-opts{display:flex;flex-wrap:wrap;gap:7px}
.sel-opt{padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink-2);transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.sel-opt:hover{border-color:#b9cdf5}
.sel-opt.on{border-color:var(--brand);background:#eef4ff;color:var(--brand);font-weight:700}
.lv{font-size:10px;border-radius:999px;padding:1px 7px;font-weight:800}
.lv-A{background:var(--must-bg);color:var(--must)}
.lv-B{background:var(--warn-bg);color:var(--warn)}
.lv-C{background:var(--rec-bg);color:var(--rec)}
.lv-AB{background:#f0e6fd;color:#6d28b8}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.hint b{color:var(--ink-2)}
/* 结果区 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-block;padding:9px 20px;border-radius:999px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand-dark)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid #c9d8f5}
.btn.ghost:hover{background:#eef4ff}
.callout{border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.callout.warn{background:var(--warn-bg);border:1px solid #f3d9b8;color:#7c4a12}
.callout.tip{background:var(--tip-bg);border:1px solid #c5e0f2;color:#15597c}
.callout b{margin-right:4px}
.check-progress{position:sticky;top:78px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.check-progress .bar{flex:1;min-width:180px;height:10px;background:#e8edf4;border-radius:999px;overflow:hidden}
.check-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#22a05c,#4ade80);border-radius:999px;transition:width .3s}
.check-progress .pct{font-weight:800;color:var(--rec);font-size:15px}
.doc-section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.doc-section h2{font-size:16.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #edf1f7;display:flex;justify-content:space-between;align-items:center}
.doc-section h2 .cnt{font-size:12px;color:var(--ink-3);font-weight:400}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;font-size:14px;transition:background .12s}
.check-item:hover{background:#f7fafd}
.check-item.checked{background:var(--rec-bg);border-color:#bfe3c9}
.check-item.checked .ci-text{color:#5b7264;text-decoration:line-through}
.check-item input{margin-top:3px;accent-color:var(--rec);width:16px;height:16px;cursor:pointer;flex:none}
.ci-text{flex:1}
.tags{font-size:11px;color:var(--ink-3);margin-top:2px}
.empty{text-align:center;color:var(--ink-3);padding:50px 10px;font-size:14px}
/* 技术要求文档输出 */
.doc-header{background:linear-gradient(135deg,#16233a,#1d4ed8);color:#fff;border-radius:14px;padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.doc-header .dh-no{font-size:13px;letter-spacing:2px;opacity:.85}
.doc-header h1{font-size:23px;margin:6px 0 8px}
.doc-header .dh-sub{font-size:14px;opacity:.92}
.doc-header .dh-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip2{display:inline-block;font-size:11.5px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.doc-body{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow)}
.doc-body h4{font-size:15.5px;margin:18px 0 8px;color:var(--brand-dark);padding-bottom:6px;border-bottom:2px solid #edf1f7}
.doc-body h4:first-child{margin-top:0}
.doc-body ol{padding-left:20px}
.doc-body li{margin-bottom:5px;font-size:14px}
.doc-note{font-size:12.5px;color:var(--ink-3);margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
footer.page-foot{margin-top:26px;color:var(--ink-3);font-size:12px;text-align:center;line-height:2}
/* 门禁 */
.lock{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#141d2e 0%,#1c2b47 55%,#16304f 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border-radius:16px;padding:36px 38px;width:400px;max-width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}
.lock-card.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lock-brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:800;color:var(--ink)}
.lock-brand .brand-mark{width:42px;height:42px;font-size:22px;flex:0 0 42px}
.lock-sub{color:var(--ink-2);font-size:13px;margin-top:6px}
.lock-hint{color:var(--ink-3);font-size:12.5px;margin:22px 0 10px}
.lock-card input{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;text-align:center;letter-spacing:2px}
.lock-card input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.lock-card button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.lock-card button:hover{background:var(--brand-dark)}
.lock-err{color:var(--must);font-size:13px;min-height:20px;margin-top:10px}
.lock-foot{color:var(--ink-3);font-size:11px;margin-top:18px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c2733;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:block}
  .selector{grid-template-columns:1fr}
  .selector .sel-panel{position:static}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .content{padding:18px 16px 50px}
}
@media print{
  .sidebar,.topbar,.toolbar,.check-progress{display:none!important}
  .content{padding:0;max-width:none}
  .doc-section,.doc-body{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  .check-item input{appearance:none;width:13px;height:13px;border:1.5px solid #666;border-radius:3px}
  .check-item input:checked{background:#666}
  body{background:#fff}
}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-brand"><div class="brand-mark">懋</div><div>懋略设计部 · PACK零部件工具库</div></div>
    <div class="lock-sub">变更验证速查 · 技术要求速查 · 内部资料</div>
    <div class="lock-hint">本页面内容受访问令牌保护，请输入令牌后进入</div>
    <input type="password" id="lockInput" placeholder="请输入访问令牌" autocomplete="off" spellcheck="false">
    <button id="lockBtn">进入</button>
    <div class="lock-err" id="lockErr"></div>
    <div class="lock-foot">未授权访问禁止使用、复制或抓取本页面数据</div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">懋</div>
      <div><div class="brand-name">懋略设计部</div><div class="brand-sub">PACK零部件工具库</div></div>
    </div>
    <nav class="nav">
      <a class="nav-item" data-view="home" href="#/home"><span class="ico">⌂</span>首页总览</a>
      <div class="nav-group-title">工具</div>
      <a class="nav-item" data-view="change" href="#/change"><span class="ico">⚡</span>变更验证速查字典</a>
      <a class="nav-item" data-view="spec" href="#/spec"><span class="ico">📐</span>技术要求速查</a>
      <div class="nav-group-title">其他</div>
      <a class="nav-item" data-view="about" href="#/about"><span class="ico">ℹ</span>使用说明</a>
    </nav>
    <div class="sidebar-foot">
      <div>版本 V1.1 · 与受控文件同步</div>
      <div>懋略 · 电池系统设计部</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索零部件 / 变更类型 / 验证项 / 技术要求关键词…（如：氦检漏 / 镀镍 / 扭脱力矩）" autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <span class="ver-pill">V1.1</span>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

: {"specs": [{"id": "tray", "name": "托盘（下箱体）", "doc_no": "ML-TS-TR-001", "filters": [{"id": "proc", "q": "主体成型工艺", "opts": [{"id": "weld", "label": "钣金/型材拼焊"}, {"id": "cast", "label": "压铸"}, {"id": "ext", "label": "挤出型材+搅拌摩擦焊"}]}, {"id": "surf", "q": "表面处理方式", "opts": [{"id": "powder", "label": "喷粉（粉末喷涂）"}, {"id": "ecoat", "label": "电泳"}, {"id": "bare", "label": "无涂层（铝裸材）"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包下箱体（托盘）类结构件，含安装梁、边框、底板及集成液冷流道结构。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 3880（系列）  铝及铝合金轧制板材", "GB/T 6892  一般工业用铝及铝合金挤压型材", "GB/T 15114  铝合金压铸件", "GB/T 2651  焊接接头拉伸试验方法", "GB/T 2653  焊接接头弯曲试验方法", "GB/T 3323（系列）  焊缝无损检测 射线检测", "GB/T 11345  焊缝无损检测 超声检测", "GB/T 1804  一般公差 未注公差的线性和角度尺寸的公差", "GB/T 1184  形状和位置公差 未注公差值", "GB/T 9286  色漆和清漆 划格试验（涂层附着力）", "GB/T 13452.2  色漆和清漆 漆膜厚度的测定", "GB/T 10125  人造气氛腐蚀试验 盐雾试验", "GB/T 15823  无损检测 氦泄漏检测方法", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "钣金拼焊：铝板牌号 5052-H32/5083-O 或图纸指定牌号，化学成分按 GB/T 3190，板材按 GB/T 3880。", "when": {"proc": ["weld"]}}, {"text": "压铸：铝合金 ADC12/A380 或图纸指定牌号，按 GB/T 15114；铸件内部缺陷按图纸等级（关键承载区 X 射线检测按 GB/T 3323，Ⅱ级合格）。", "when": {"proc": ["cast"]}}, {"text": "挤出型材：6061-T6/6063-T6 或图纸指定牌号，按 GB/T 6892。", "when": {"proc": ["ext"]}}, "原材料每炉批须提供材质证明（CoA），首批及变更时复验化学成分（光谱法）与力学性能。", "禁用物质：符合 GB/T 30512 与 RoHS 要求。"]}, {"t": "4  尺寸与公差", "items": ["未注线性/角度公差按 GB/T 1804-m 级；未注形位公差按 GB/T 1184-K 级。", "车身安装孔位位置度 ≤Φ0.5mm；模组/冷板安装面平面度 ≤0.5mm/m（关键面图纸标注优先）。", "密封面轮廓度 ≤0.5mm，表面粗糙度 Ra≤3.2μm（图纸标注优先）。", "首件及每批按控制计划执行全尺寸/CMM 检测，KPC 特性 Cpk≥1.67。"]}, {"t": "5  外观要求", "items": ["表面无裂纹、明显压痕、磕碰、锈蚀、异物；棱边倒钝去毛刺（毛刺高度≤0.2mm）。", {"text": "焊缝外观：成形均匀，无咬边、气孔、裂纹、焊瘤、未熔合；密封焊缝 100% 目视。", "when": {"proc": ["weld", "ext"]}}]}, {"t": "6  加工工艺要求", "items": [{"text": "焊接工艺须经工艺评定（PQR），焊工/焊机参数受控；密封焊缝连续，焊接接头强度不低于母材标准值的 80%。", "when": {"proc": ["weld", "ext"]}}, {"text": "搅拌摩擦焊：焊缝无隧道、未焊合缺陷；焊后焊缝区拉伸强度按 GB/T 2651 复验。", "when": {"proc": ["ext"]}}, {"text": "压铸：模具温度/压射参数受控，禁止焊补关键承载与密封区域；去浇口后无残留毛刺。", "when": {"proc": ["cast"]}}, "加工后清洗除油、除铝屑，腔体内无残留异物（集成液冷结构按清洁度要求，参照 ISO 16232）。"]}, {"t": "7  表面处理要求", "items": [{"text": "喷粉：环氧/聚酯粉末，膜厚 60~100μm（GB/T 13452.2）；附着力划格法 0~1 级（GB/T 9286）；耐中性盐雾 ≥500h（GB/T 10125）后附着力复测不低于 1 级。", "when": {"surf": ["powder"]}}, {"text": "电泳：膜厚 15~25μm；附着力 0~1 级；耐中性盐雾 ≥720h 无起泡、无锈蚀蔓延（划叉处单边蔓延≤2mm）。", "when": {"surf": ["ecoat"]}}, {"text": "铝裸材：表面无氧化斑、油污；与涂层件搭接的导电/绝缘区域按图纸遮蔽要求执行。", "when": {"surf": ["bare"]}}, "涂层绝缘区域（如有）：绝缘电阻 ≥100MΩ（500V DC），耐压 2500V DC/60s 无击穿。"]}, {"t": "8  性能要求", "items": ["总成气密性（参与密封时）：按图纸泄漏率要求（典型 ≤10 mbar·L/s 或按整包 IP 要求折算）。", "承载强度：按图纸/技术协议的静强度与刚度要求，加载后无裂纹、无塑性变形超标。", {"text": "焊接接头拉伸强度按 GB/T 2651 试验，不低于设计要求值。", "when": {"proc": ["weld", "ext"]}}, "集成液冷流道：氦检漏 ≤1×10⁻⁵ Pa·m³/s（GB/T 15823），爆破压力 ≥4 倍工作压力。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["中性盐雾：按第7章对应等级执行（GB/T 10125）。", "温度冲击：-40℃~+85℃ 各保温 1h，20 个循环（GB/T 2423.22），试验后无裂纹、涂层无起泡脱落，气密复测合格。", "耐湿热：+85℃/85%RH，240h（GB/T 2423.3），试验后涂层附着力复测 0~1 级。", "振动耐久：随整包按 GB/T 31467.3 / 整车型谱执行，试验后焊缝与连接无裂纹。"]}, {"t": "10  试装与匹配要求", "items": ["与车身、模组、上盖、管路的接口按图纸执行装配验证；吊装点适配产线吊具。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（安装孔位/平面度/密封面）、涂层膜厚、气密（适用时）", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/工艺/场地/模具变更时", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "大型薄壁件包装须防平面度变形，堆码层数按包装方案限定。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "cover", "name": "上盖", "doc_no": "ML-TS-CV-001", "filters": [{"id": "mat", "q": "主体材质", "opts": [{"id": "steel", "label": "钣金（钢/铝）"}, {"id": "smc", "label": "SMC/复合材料"}, {"id": "inj", "label": "注塑工程塑料"}]}, {"id": "surf", "q": "表面处理方式", "opts": [{"id": "powder", "label": "喷粉"}, {"id": "ecoat", "label": "电泳"}, {"id": "none", "label": "无涂层"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包上盖（盖板）类零部件，含金属与非金属材质。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 5213  冷轧低碳钢板及钢带", "GB/T 15568  通用型片状模塑料（SMC）", "GB/T 14486  塑料模塑件尺寸公差", "GB/T 2408  塑料 燃烧性能的测定 水平法和垂直法", "GB/T 9286  划格试验", "GB/T 10125  盐雾试验", "GB/T 1804  一般公差", "GB 38031  电动汽车用动力蓄电池安全要求", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "钣金：冷轧钢板（SPCC/DC01）或铝板（5052/6061），每炉批提供 CoA 并复验。", "when": {"mat": ["steel"]}}, {"text": "SMC/复材：玻纤含量 ≥25%（灼烧法 GB/T 2577），阻燃 UL94 V-0（1.5mm，GB/T 2408），热变形温度 ≥200℃。", "when": {"mat": ["smc"]}}, {"text": "注塑：阻燃增强尼龙/PBT（如 PA66-GF30），阻燃 UL94 V-0（壁厚对应等级），提供粒子牌号证明与 UL 黄卡。", "when": {"mat": ["inj"]}}, "与电解液/冷却液可能接触的部位须提供耐介质声明或试验数据。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": [{"text": "金属件未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916。", "when": {"mat": ["steel"]}}, {"text": "模塑件尺寸公差按 GB/T 14486 相应 MT 等级（图纸标注优先）。", "when": {"mat": ["smc", "inj"]}}, "螺栓孔位位置度 ≤Φ0.4mm；密封面平面度/轮廓度按图纸（典型 ≤0.4mm/m）。"]}, {"t": "5  外观要求", "items": ["无裂纹、缺料、分层、缩痕、飞边；棱边去毛刺；颜色/纹理按签样件。", "密封面无划伤、无涂层堆积。"]}, {"t": "6  加工工艺要求", "items": [{"text": "冲压：折弯半径 ≥1.0t，折弯方向与轧制方向垂直优先；孔边距 ≥1.5t。", "when": {"mat": ["steel"]}}, {"text": "模压/注塑：工艺参数窗口受控，熔接线避开密封面与固定点；顶针印不得凸出密封面。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "7  表面处理要求", "items": [{"text": "喷粉：膜厚 60~100μm，附着力 0~1 级（GB/T 9286），中性盐雾 ≥500h（GB/T 10125）。", "when": {"surf": ["powder"]}}, {"text": "电泳：膜厚 15~25μm，附着力 0~1 级，中性盐雾 ≥720h。", "when": {"surf": ["ecoat"]}}, {"text": "无涂层：表面无氧化、油污；非金属件不适用本章。", "when": {"surf": ["none"]}}, "金属盖与箱体的 EMC 搭接面（如有）按图纸保持导电连续（接触电阻 ≤50mΩ）。"]}, {"t": "8  性能要求", "items": ["总成刚度：按图纸加载要求，残余变形不超标；固定点拉脱强度按图纸。", "整包气密配合：与密封圈/托盘配合后满足整包 IP 等级（GB 38031、GB/T 4208）。", {"text": "非金属盖：阻燃 UL94 V-0；并参与整包热扩散防护验证（GB 38031）。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "9  老化、耐候与耐久要求", "items": ["温度冲击 -40℃~+85℃×20 循环（GB/T 2423.22）后无裂纹、无变形超标，气密配合复测合格。", "湿热 +85℃/85%RH×240h（GB/T 2423.3）后涂层/材料无起泡、附着力 0~1 级。", {"text": "非金属盖：热老化 120℃×500h（GB/T 7141）后拉伸强度保持率 ≥70%。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（孔位/密封面）、膜厚（适用时）", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/工艺/场地/模具变更时", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "薄壁大平面件防压防变形，竖放或专用料架运输。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "coldplate", "name": "冷板（液冷板）", "doc_no": "ML-TS-CP-001", "filters": [{"id": "proc", "q": "流道成型/连接工艺", "opts": [{"id": "braze", "label": "冲压+钎焊"}, {"id": "fsw", "label": "搅拌摩擦焊"}, {"id": "tube", "label": "口琴管/挤出管"}]}, {"id": "surf", "q": "外表面处理", "opts": [{"id": "bare", "label": "铝裸材"}, {"id": "ins", "label": "绝缘涂层/喷粉"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包液冷板（含流道板、进出水接头）类零部件。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 3880  铝及铝合金轧制板材", "GB/T 6892  挤压型材", "GB/T 15823  氦泄漏检测方法", "GB/T 10125  盐雾试验", "GB/T 2651  焊接接头拉伸试验", "ISO 16232  道路车辆 流体回路部件清洁度", "GB/T 3323  焊缝射线检测", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["铝合金 3003/3003mod/6063 或图纸指定牌号（钎焊板为复合钎料层结构），化学成分按 GB/T 3190，每炉批 CoA。", "钎料/焊丝牌号与母材匹配，提供材质证明。", "与冷却液接触材料须提供相容性数据（50%乙二醇水溶液，88℃×1000h 参照 GB/T 1690 评估）。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；流道截面尺寸按图纸（影响流阻，为关键特性）。", "与模组贴合面平面度 ≤0.3mm/m（图纸优先），粗糙度 Ra≤3.2μm。", "进出水口接口尺寸按图纸/接头匹配规范，位置度 ≤Φ0.5mm。"]}, {"t": "5  外观要求", "items": ["表面无压痕、裂纹、焊渣、毛刺；流道口倒角、无翻边堵塞。", "钎焊缝/搅拌摩擦焊缝外观均匀，无未焊合、气孔、烧穿。"]}, {"t": "6  加工工艺要求", "items": [{"text": "钎焊：钎焊炉温曲线受控（记录可追溯），钎着率按图纸（典型 ≥90%，切片/CT 抽检）。", "when": {"proc": ["braze"]}}, {"text": "搅拌摩擦焊：参数受控，焊缝无隧道缺陷；首件及定期做焊缝拉伸（GB/T 2651）与金相。", "when": {"proc": ["fsw"]}}, "焊后清洗：内腔无钎剂残留、无颗粒物；清洁度按 ISO 16232（颗粒度等级按图纸，典型：最大颗粒 ≤500μm）。", "流道 100% 通流检查（通气/通球），确保无堵塞。"]}, {"t": "7  表面处理要求", "items": [{"text": "铝裸材：表面无氧化斑、油污，贴合面无涂层（保证导热）。", "when": {"surf": ["bare"]}}, {"text": "绝缘涂层/喷粉：膜厚按图纸（典型 50~120μm，过厚影响换热需评估），附着力 0~1 级（GB/T 9286）；耐压 ≥3000V DC/60s、绝缘电阻 ≥500MΩ（1000V DC）；盐雾 ≥500h（GB/T 10125）。", "when": {"surf": ["ins"]}}]}, {"t": "8  性能要求", "items": ["氦检漏：≤1×10⁻⁶ ~ 1×10⁻⁵ Pa·m³/s（GB/T 15823，按图纸），100% 全检。", "爆破压力：≥4 倍最大工作压力，保压无破裂、无永久变形（典型 ≥2.0MPa）。", "耐压脉冲：工作压力 0.1~1.0 倍交变，≥10 万次（或按图纸），试验后检漏合格。", "流阻/压降：在设计流量下实测压降与设计值偏差 ≤±10%（首批必测并固化基准）。", "耐内腐蚀：冷却液 88℃×1000h 循环腐蚀试验后，流道无穿孔，腐蚀深度 ≤0.1mm，检漏合格。", "热阻/换热性能：首批提供实测数据（稳态法，参照 ASTM D5470 或等效方法），作为变更比对基准。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["温度冲击 -40℃~+120℃（进水侧介质温度区间按图纸）×30 循环（GB/T 2423.22），试验后检漏合格。", "振动：随整包 GB/T 31467.3，试验后检漏、压降复测合格。", "外表面盐雾按第7章；接头部位随整包盐雾评估。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、流道口尺寸、氦检漏（全检）、贴合面平面度", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/钎料/工艺/场地变更时（含爆破、脉冲、内腐蚀、流阻全项）", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "管口必须封堵（堵帽/胶带），防止异物进入流道；防压防磕碰。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。", "冷却液相容性声明与内腐蚀数据为 PPAP 必备附件。"]}]}, {"id": "cu_bar", "name": "铜排", "doc_no": "ML-TS-CU-001", "filters": [{"id": "surf", "q": "表面处理方式", "opts": [{"id": "ni", "label": "镀镍"}, {"id": "sn", "label": "镀锡"}, {"id": "bare", "label": "裸铜（无镀层）"}, {"id": "ins", "label": "包塑/浸塑绝缘"}]}, {"id": "proc", "q": "成型工艺", "opts": [{"id": "stamp", "label": "冲压+折弯"}, {"id": "cnc", "label": "铣削加工"}, {"id": "flex", "label": "软连接（铜箔叠层）"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包内铜质导电母排（硬排）及铜软连接，额定电压 ≤1000V DC。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 5231  加工铜及铜合金牌号和化学成分", "GB/T 2040  铜及铜合金板材", "GB/T 2059  铜及铜合金带材", "GB/T 9798  金属覆盖层 镍电沉积层", "GB/T 12599  金属覆盖层 锡电镀层 技术规范和试验方法", "GB/T 5270  金属基体上的金属覆盖层 附着强度试验方法", "GB/T 6462  金属和氧化物覆盖层 厚度测量 显微镜法", "GB/T 16921  金属覆盖层 X射线光谱法测厚", "GB/T 10125  盐雾试验", "GB/T 13914/13915/13916  冲压件尺寸/角度/形位公差", "GB/T 1804  一般公差", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["T2 紫铜（Cu+Ag ≥99.90%，GB/T 5231），板材 GB/T 2040、带材 GB/T 2059；每炉批 CoA。", "导电率 ≥97% IACS（涡流/电桥法实测，首批及变更时）。", {"text": "硬排力学性能：软态 M 抗拉 ≥195MPa、延伸率 ≥30%；半硬 Y2 抗拉 245~345MPa（按 GB/T 2040）。", "when": {"proc": ["stamp", "cnc"]}}, {"text": "软连接：T2 铜箔 0.05~0.3mm 叠层，焊区（扩散焊/分子焊）无虚焊，焊区剥离强度按图纸。", "when": {"proc": ["flex"]}}, "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916 相应等级。", "折弯角度公差 ±0.5°；安装孔径公差 H11（图纸优先）；搭接面平面度 ≤0.1mm/100mm。", "绝缘间隙/爬电距离按图纸（高压区域典型：间隙 ≥5.5mm/爬电 ≥6.3mm @1000V 按污染等级校核，以图纸为准）。"]}, {"t": "5  外观要求", "items": ["表面无裂纹、起皮、压痕、氧化变色；棱边、孔口去毛刺（毛刺 ≤0.1mm）。", "折弯区无裂纹（10 倍放大检查）；镀层色泽均匀、无漏镀、无烧焦。"]}, {"t": "6  加工工艺要求", "items": [{"text": "折弯：最小折弯半径 ≥1.0t（软态）/≥1.5t（硬态），折弯线垂直于轧制方向优先；同一位置禁止重复折弯。", "when": {"proc": ["stamp"]}}, {"text": "铣削：棱边倒角 R0.5±0.2 或按图纸；加工后清洗除屑。", "when": {"proc": ["cnc"]}}, {"text": "软连接：叠层对齐、焊区面积按图纸；软连接段绝缘套管（热缩管）包覆完整。", "when": {"proc": ["flex"]}}, "冲压/铣削后 100% 去毛刺并清洗；成品表面电阻（搭接区域）不得因加工硬化超标。"]}, {"t": "7  表面处理要求", "items": [{"text": "镀镍（GB/T 9798）：镍层厚度 ≥5μm（一般面）/≥8μm（搭接面），厚度按 GB/T 16921（X荧光）或 GB/T 6462 测定；附着力按 GB/T 5270 弯曲/热震法，无起皮脱落；中性盐雾 96h（GB/T 10125）后无基材腐蚀、接触电阻变化 ≤20%。", "when": {"surf": ["ni"]}}, {"text": "镀锡（GB/T 12599）：锡层厚度 ≥5μm（搭接面 ≥8μm）；附着力合格；中性盐雾 48h 后无基材腐蚀；防锡须：雾锡（哑光锡）工艺或按图纸。", "when": {"surf": ["sn"]}}, {"text": "裸铜：表面做防氧化处理（钝化/防变色剂），包装加干燥剂；搭接面接触电阻按图纸（典型 ≤20μΩ）。", "when": {"surf": ["bare"]}}, {"text": "包塑/浸塑（环氧粉末/PA12/PVC）：涂层厚度 0.3~0.8mm，无针孔（电火花检漏 3kV）；附着力划格 0~1 级；耐压 ≥3000V DC/60s 无击穿；绝缘电阻 ≥500MΩ（1000V DC）。", "when": {"surf": ["ins"]}}, "镀层/涂层区域与尺寸按图纸（含遮蔽区域）。"]}, {"t": "8  性能要求", "items": ["温升：额定持续电流下搭接面温升 ≤55K（按 GB/T 5095 或协议方法，首批实测并固化基准）。", "搭接面接触电阻：按图纸（典型 ≤20μΩ/面），首批及表面处理变更时必测。", {"text": "包塑件：耐压 ≥3000V DC/60s、绝缘电阻 ≥500MΩ、局部放电（如要求）按图纸。", "when": {"surf": ["ins"]}}, "载流能力：按图纸截面积核算，首批温升实测验证。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["中性盐雾：镀镍 96h / 镀锡 48h / 裸铜 24h（防变色评估）/ 包塑 96h（GB/T 10125），试验后外观、接触电阻复测合格。", "温度循环 -40℃~+125℃×100 次（GB/T 2423.22），试验后无裂纹、包塑无开裂、接触电阻变化 ≤20%。", "湿热 +85℃/85%RH×240h（GB/T 2423.3），试验后绝缘/耐压复测合格（包塑件）。", "振动：随整包 GB/T 31467.3，试验后连接无松动、接触电阻变化 ≤20%。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（孔位/折弯角度/平面度）、镀层厚度、接触电阻", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/表面/工艺/场地变更时（含温升、盐雾全项）", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "镀层件防氧化防潮包装（干燥剂/防锈袋），禁止裸手接触搭接面。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "al_bar", "name": "铝排", "doc_no": "ML-TS-AL-001", "filters": [{"id": "surf", "q": "表面处理方式", "opts": [{"id": "ni", "label": "镀镍"}, {"id": "sn", "label": "镀锡"}, {"id": "bare", "label": "裸铝（导电氧化/钝化）"}, {"id": "ins", "label": "包塑/浸塑绝缘"}]}, {"id": "proc", "q": "成型工艺", "opts": [{"id": "stamp", "label": "冲压+折弯"}, {"id": "cnc", "label": "铣削加工"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包内铝质导电母排，额定电压 ≤1000V DC。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 3880  铝及铝合金轧制板材", "GB/T 9798  镍电沉积层", "GB/T 12599  锡电镀层", "GB/T 5270  覆盖层附着强度", "GB/T 16921  X荧光测厚", "GB/T 10125  盐雾试验", "GB/T 13914/13915/13916  冲压件公差", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["牌号 1060/6101/6063 或图纸指定（GB/T 3190），板材 GB/T 3880；每炉批 CoA。", "导电率：1060 ≥61% IACS、6101-T6 ≥55% IACS（首批实测）；抗拉强度/延伸率按 GB/T 3880 状态要求。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916。", "折弯角度 ±0.5°；孔径 H11；搭接面平面度 ≤0.1mm/100mm。", "绝缘间隙/爬电距离按图纸。"]}, {"t": "5  外观要求", "items": ["无裂纹、起皮、压痕；去毛刺 ≤0.1mm；折弯区无裂纹（10 倍放大）。", "镀层色泽均匀、无漏镀。"]}, {"t": "6  加工工艺要求", "items": ["最小折弯半径 ≥1.5t（6061-T6 等硬态 ≥2.0t），折弯线垂直于轧制方向优先；禁止重复折弯。", "铝件镀前须专用前处理（沉锌），供方须有铝上电镀合格工艺评定。"]}, {"t": "7  表面处理要求", "items": [{"text": "镀镍（GB/T 9798）：厚度 ≥5μm/搭接面 ≥8μm；附着力 GB/T 5270 合格；中性盐雾 96h 无基材腐蚀（GB/T 10125）。", "when": {"surf": ["ni"]}}, {"text": "镀锡（GB/T 12599）：厚度 ≥5μm；附着力合格；中性盐雾 48h 无基材腐蚀。", "when": {"surf": ["sn"]}}, {"text": "裸铝：导电氧 每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "防挤压变形、避光防臭氧；保质期（典型 12 个月）标识。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "pipe", "name": "水管（冷却管路）", "doc_no": "ML-TS-WP-001", "filters": [{"id": "mat", "q": "管材材质", "opts": [{"id": "pa", "label": "尼龙管（PA12/PA6）"}, {"id": "epdm", "label": "橡胶管（EPDM）"}, {"id": "tpv", "label": "TPV/TPV复合"}]}, {"id": "joint", "q": "接头形式", "opts": [{"id": "qc", "label": "快插接头"}, {"id": "clamp", "label": "卡箍+宝塔接头"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包冷却系统水管（含接头总成）。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 5563  橡胶和塑料软管及软管组合件 静液压试验（爆破）", "GB/T 5568  橡胶或塑料软管及软管组合件 无曲挠液压脉冲试验", "GB/T 1690  耐液体", "GB/T 531.1  邵氏硬度（橡胶管）", "ISO 16232  清洁度（参考）", "GB/T 2423（系列）", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "尼龙管：PA12/PA6（含增强层结构按图纸），耐温 -40℃~+120℃。", "when": {"mat": ["pa"]}}, {"text": "EPDM 橡胶管：内胶层耐冷却液，增强层（编织/缠绕）按图纸；硬度 65±5 Shore A。", "when": {"mat": ["epdm"]}}, {"text": "TPV：耐温 -40℃~+135℃，耐冷却液。", "when": {"mat": ["tpv"]}}, "快插接头：塑料（PA66-GF30）或金属按图纸，密封圈材质与冷却液兼容（EPDM/FKM）。", "每批 CoA；RoHS 符合。"]}, {"t": "4  尺寸与公差", "items": ["内外径、壁厚按图纸（壁厚公差 ±10%）；长度 ±5mm；弯曲半径按图纸（最小弯曲半径不得小于图纸值）。", "接头接口尺寸按快插标准/图纸（插拔力与拉脱力为关键特性）。"]}, {"t": "5  外观要求", "items": ["管壁无气泡、杂质、划伤（深度≤0.2mm）、扭结；管口倒角无毛刺；接头无飞边、密封面无划伤。"]}, {"t": "6  加工工艺要求", "items": ["挤出/硫化工艺参数受控；接头装配（扣压/注塑）首件做拉脱与密封验证。", "总成 100% 气检/通流检查；内腔清洁度按 ISO 16232（最大颗粒 ≤500μm）。"]}, {"t": "8  性能要求", "items": ["爆破压力（GB/T 5563）：≥4 倍最大工作压力（典型 ≥1.6MPa）。", "耐压脉冲（GB/T 5568）：0.1~1.0 倍工作压力交变 ≥10         var h=[...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,'0')}).join('');

      }).catch(function(){v==='Mor'+'lus'?ok():bad();});
    }else{v==='Mor'+'lus'?ok():bad();}
  }
  document.getElementById('lockBtn').onclick=tryLogin;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
  inp.focus();
})();

  <footer class="page-foot">试验标准以现行有效版本为准（GB 38031 / GB/T 31467.3 / ISO 12405 / UL 2580 / ECE R100 等）<br>懋略 · 电池系统设计部 · 内部受控</footer>`;
}

/* ============ 变更验证视图 ============ */
function vChange(){
  const comps = CD.components.map(c=>`<button class="part-btn${cComp===c.id?' on':''}" data-id="${c.id}" onclick="pickComp('${c.id}')">${c.name}</button>`).join('');
  const chips = CD.change_types.map(t=>{
    const lv=HINT[t.id]||'B', cls=lv==='A/B'?'lv-AB':'lv-'+lv;
    return `<span class="sel-opt${cTypes.has(t.id)?' on':''}" onclick="pickType('${t.id}')">${t.name} <i class="lv ${cls}">${lv}</i></span>`;
  }).join('');
  let defs='';
  if(cTypes.size){ defs=[...cTypes].map(id=>{const t=CD.change_types.find(x=>x.id===id);
    return `<div style="margin-top:6px"><b>${t.name}</b>：${t.def} <span style="color:var(--ink-3)">[${HNOTE[id]||''}]</span></div>`;}).join(''); }

  let right='';
  if(!cComp || !cTypes.size){
    right='<div class="card pad"><div class="empty">👈 请先选择零部件，再勾选变更类型（可多选）</div></div>';
  }else{
    const comp=CD.components.find(c=>c.id===cComp);
    const cats={}; CD.categories.forEach(c=>cats[c.id]={name:c.name,map:new Map()});
    cTypes.forEach(tid=>{const cell=comp.changes[tid];if(!cell)return;
      const tn=CD.change_types.find(x=>x.id===tid).name;
      Object.entries(cell).forEach(([cat,items])=>{if(!cats[cat])return;
        items.forEach(it=>{if(!cats[cat].map.has(it))cats[cat].map.set(it,new Set());cats[cat].map.get(it).add(tn);});});});
    let total=0;Object.values(cats).forEach(c=>total+=c.map.size);
    const asmN=cats.assembly?cats.assembly.map.size:0, packN=cats.pack?cats.pack.map.size:0;
    let lv='C';cTypes.forEach(id=>{const l=HINT[id]||'B';if(LV_ORDER[l]>LV_ORDER[lv])lv=l;});
    const lvTxt=lv==='A'?'A类（重大变更）':lv==='A/B'?'A/B类（视影响就高）':lv==='B'?'B类（一般变更）':'C类（简化验证）';
    const guide=lv==='A'?CD.meta.classes[0].path:lv==='C'?CD.meta.classes[2].path:CD.meta.classes[1].path;

    right+=`<div class="stat-row">
      <div class="stat"><div class="num">${total}</div><div class="lbl">待执行验证动作</div></div>
      <div class="stat"><div class="num">${asmN}</div><div class="lbl">装配/试装认可项</div></div>
      <div class="stat"><div class="num">${packN}</div><div class="lbl">PACK 系统级认可项</div></div>
      <div class="stat dark"><div class="num">${lvTxt}</div><div class="lbl">建议变更级别（就高）</div></div>
    </div>
    <div class="callout warn"><b>执行路径提示</b>${guide}</div>
    <div class="toolbar">
      <button class="btn" onclick="window.print()">🖨 打印 / 另存 PDF</button>
      <button class="btn ghost" onclick="copyChange()">📋 复制清单文本</button>
      <button class="btn ghost" onclick="checked.clear();render();toast('勾选进度已清空')">↺ 清空勾选进度</button>
    </div>
    <div class="check-progress" id="prog"><span style="font-size:13px;color:var(--ink-2)">完成进度</span><div class="bar"><i id="progBar" style="width:0%"></i></div><span class="pct" id="progPct">0%</span></div>`;
    CD.categories.forEach(c=>{
      const grp=cats[c.id];if(!grp||!grp.map.size)return;
      right+=`<div class="doc-section"><h2>${grp.name}<span class="cnt">${grp.map.size} 项 · <span data-prog></span></span></h2>`;
      [...grp.map.entries()].forEach(([it,srcs])=>{
        const key=cComp+'|'+it, isC=checked.has(key);
        right+=`<div class="check-item${isC?' checked':''}" onclick="toggleItem(this,'${esc(key).replace(/'/g,"\\'")}')">
          <input type="checkbox" ${isC?'checked':''} onclick="event.stopPropagation()">
          <div class="ci-text">${esc(it)}${srcs.size>1?`<div class="tags">来源：${[...srcs].join('、')}</div>`:''}</div></div>`;
      });
      right+='</div>';
    });
  }

  return `
  <div class="page-head"><div class="page-title">变更验证速查字典</div>
  <div class="page-desc">依据《设计部零部件变更验证管理办法》V1.0 · 同一零部件多项变更并发时验证项取并集、级别就高</div></div>
  <div class="selector">
    <div class="sel-panel">
      <div class="card pad sel-group"><div class="sg-label">第 1 步 · 选择零部件</div><div class="part-grid">${comps}</div></div>
      <div class="card pad sel-group"><div class="sg-label">第 2 步 · 勾选变更类型（可多选）</div><div class="sel-opts">${chips}</div>${defs?`<div class="hint">${defs}</div>`:''}</div>
    </div>
    <div id="changeRight">${right}</div>
  </div>`;
}
function pickComp(id){cComp=id;render();}
function pickType(id){cTypes.has(id)?cTypes.delete(id):cTypes.add(id);render();}
function toggleItem(el,key){
  const cb=el.querySelector('input');
  cb.checked=!cb.checked;
  cb.checked?checked.add(key):checked.delete(key);
  el.classList.toggle('checked',cb.checked);
  updateProg();
}
function updateProg(){
  const boxes=[...document.querySelectorAll('#changeRight input[type=checkbox]')];
  const done=boxes.filter(b=>b.checked).length;
  const pct=boxes.length?Math.round(done/boxes.length*100):0;
  const bar=document.getElementById('progBar'),pc=document.getElementById('progPct');
  if(bar){bar.style.width=pct+'%';pc.textContent=done+'/'+boxes.length+' · '+pct+'%';}
  document.querySelectorAll('#changeRight .doc-section').forEach(sec=>{
    const bs=[...sec.querySelectorAll('input[type=checkbox]')];
    const d=bs.filter(b=>b.checked).length;
    const el=sec.querySelector('[data-prog]');
    if(el)el.textContent=d+'/'+bs.length+' 完成';
  });
}
function copyChange(){
  if(!cComp||!cTypes.size)return;
  const comp=CD.components.find(c=>c.id===cComp);
  let txt='变更验证执行清单\n零部件：'+comp.name+'\n变更类型：'+[...cTypes].map(id=>CD.change_types.find(x=>x.id===id).name).join('、')+'\n\n';
  document.querySelectorAll('#changeRight .doc-section').forEach(sec=>{
    txt+=sec.querySelector('h2').childNodes[0].textContent+'\n';
    sec.querySelectorAll('.check-item').forEach((it,i)=>{
      txt+=(i+1)+'. ['+(it.querySelector('input').checked?'√':' ')+'] '+it.querySelector('.ci-text').childNodes[0].textContent+'\n';
    });
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>toast('清单已复制到剪贴板'));
}

/* ============ 技术要求视图 ============ */
function vSpec(){
  const grid=SD.specs.map(s=>`<button class="part-btn${sSpec===s.id?' on':''}" onclick="pickSpec('${s.id}')">${s.name}</button>`).join('');
  let filterHtml='';
  const sp=SD.specs.find(s=>s.id===sSpec);
  if(sp&&sp.filters.length){
    filterHtml=sp.filters.map(f=>`<div class="sel-group"><div class="sg-label">${f.q}</div><div class="sel-opts">${
      f.opts.map(o=>`<span class="sel-opt${sOpt[f.id]===o.id?' on':''}" onclick="pickOpt('${f.id}','${o.id}')">${o.label}</span>`).join('')}</div></div>`).join('');
  }
  let right='<div class="card pad"><div class="empty">👈 请先选择物料分类</div></div>';
  if(sp){
    const missing=sp.filters.filter(f=>!sOpt[f.id]);
    const varTxt=sp.filters.map(f=>{const o=f.opts.find(x=>x.id===sOpt[f.id]);return f.q+'：'+(o?o.label:'未选择');}).join('；');
    let body='';
    sp.sections.forEach(sec=>{
      const items=sec.items.filter(it=>typeof it==='string'?true:matchOpt(it.when));
      if(!items.length)return;
      body+=`<h4>${esc(sec.t)}</h4><ol>`;
      items.forEach(it=>{body+=`<li>${esc(typeof it==='string'?it:it.text)}</li>`;});
      body+='</ol>';
    });
    right=`
    <div class="toolbar">
      <button class="btn" onclick="window.print()">🖨 打印 / 另存 PDF</button>
      <button class="btn ghost" onclick="copySpec()">📋 复制技术要求全文</button>
    </div>
    <div class="doc-header">
      <div class="dh-no">${sp.doc_no} · 版本 V1.0 · 密级：内部受控</div>
      <h1>产品技术要求 · ${sp.name}</h1>
      <div class="dh-sub">${missing.length?'<span style="color:#ffd166">⚠ 还有 '+missing.length+' 个变型条件未选择，下方仅显示通用条款，选完自动补齐</span>':'已按所选变型生成完整技术要求'}</div>
      <div class="dh-meta">${sp.filters.map(f=>{const o=f.opts.find(x=>x.id===sOpt[f.id]);return `<span class="chip2">${f.q}：${o?o.label:'未选择'}</span>`;}).join('')}</div>
    </div>
    <div class="doc-body" id="specDoc">${body}
      <div class="doc-note">说明：本技术要求为该类物料的通用底线要求；所引用标准以现行有效版本为准；图纸、数模、技术协议中有更严要求时，从其要求。正式文件以受控版 ${sp.doc_no} Word 文件为准。</div>
    </div>`;
  }
  return `
  <div class="page-head"><div class="page-title">技术要求速查</div>
  <div class="page-desc">选择物料分类 → 收敛变型条件 → 生成可复制的标准化技术要求 · 配套 ML-TS 系列受控 Word 文件</div></div>
  <div class="selector">
    <div class="sel-panel">
      <div class="card pad sel-group"><div class="sg-label">第 1 步 · 选择物料分类</div><div class="part-grid">${grid}</div></div>
      ${filterHtml?`<div class="card pad"><div class="sg-label" style="margin-bottom:12px">第 2 步 · 收敛变型条件</div>${filterHtml}</div>`:''}
    </div>
    <div>${right}</div>
  </div>`;
}
function matchOpt(when){if(!when)return true;for(const k in when){if(!sOpt[k]||when[k].indexOf(sOpt[k])<0)return false;}return true;}
function pickSpec(id){sSpec=id;sOpt={};render();}
function pickOpt(fid,oid){sOpt[fid]=oid;render();}
function copySpec(){
  const sp=SD.specs.find(s=>s.id===sSpec);if(!sp)return;
  const varTxt=sp.filters.map(f=>{const o=f.opts.find(x=>x.id===sOpt[f.id]);return f.q+'：'+(o?o.label:'未选择');}).join('；');
  let txt='产品技术要求\n'+sp.doc_no+' · V1.0 · 内部受控\n'+sp.name+'\n'+varTxt+'\n\n';
  document.querySelectorAll('#specDoc h4').forEach(h=>{
    txt+=h.textContent+'\n';
    const ol=h.nextElementSibling;
    if(ol){ol.querySelectorAll('li').forEach((li,i)=>{txt+=(i+1)+'. '+li.textContent+'\n';});}
    txt+='\n';
  });
  txt+='说明：本技术要求为该类物料的通用底线要求；所引用标准以现行有效版本为准；图纸、数模、技术协议中有更严要求时，从其要求。\n';
  navigator.clipboard.writeText(txt).then(()=>toast('技术要求全文已复制'));
}

  return `
  <div class="page-head"><div class="page-title">使用说明</div></div>
  <div class="doc-section"><h2>工具定位</h2>
    <p>本工具库是《设计部零部件变更验证管理办法》与 ML-TS 系列《产品技术要求》的在线速查版本，用于工程师快速查询与生成执行清单；正式放行以会签的纸质/受控电子文件为准。</p></div>
  <div class="doc-section"><h2>变更验证速查字典 · 用法</h2>
    <ol style="padding-left:20px">
      <li>选择零部件 → 勾选变更类型（可多选，多项变更并发取并集、级别就高）；</li>
      <li>按生成的八类动作清单逐项执行，可在线勾选进度、打印或复制清单；</li>
      <li>复制结果粘贴到《变更验证计划单》（Excel 模板），完成后提交设计主管回收归档。</li>
    </ol></div>
  <div class="doc-section"><h2>技术要求速查 · 用法</h2>
    <ol style="padding-left:20px">
      <li>选择物料分类 → 按产品实际方案收敛变型条件（材质/工艺/表面处理等）；</li>
      <li>生成的技术要求可直接复制，作为图纸技术要求的编制基础或供应商交底材料；</li>
      <li>受控版本为 ML-TS 系列 Word 文件，图纸有特殊要求时以图纸为准。</li>
    </ol></div>
  <div class="doc-section"><h2>基本规则</h2>
    <ol style="padding-left:20px">${CD.meta.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>
  <footer class="page-foot">版本 V1.1 · 懋略 · 电池系统设计部 · 内部受控</footer>`;
}

/* ============ 搜索 ============ */
let SEARCH_IDX=null;
function buildIdx(){
  SEARCH_IDX=[];
  CD.components.forEach(c=>{
    SEARCH_IDX.push({view:'change',comp:c.id,title:c.name,doc:'变更验证 · 零部件',text:c.name});
    Object.keys(c.changes).forEach(chid=>{
      const tn=CD.change_types.find(x=>x.id===chid).name;
      SEARCH_IDX.push({view:'change',comp:c.id,types:[chid],title:c.name+' · '+tn,doc:'变更验证',text:tn});
      Object.values(c.changes[chid]).flat().forEach(it=>{
        SEARCH_IDX.push({view:'change',comp:c.id,types:[chid],title:c.name+' · '+tn,doc:'变更验证动作',text:it});
      });
    });
  });
  SD.specs.forEach(sp=>{
    SEARCH_IDX.push({view:'spec',spec:sp.id,title:sp.name,doc:sp.doc_no+' 技术要求',text:sp.name});
    sp.sections.forEach(sec=>sec.items.forEach(it=>{
      const t=typeof it==='string'?it:it.text;
      SEARCH_IDX.push({view:'spec',spec:sp.id,title:sp.name+' · '+sec.t,doc:sp.doc_no,text:t});
    }));
  });
}
const si=document.getElementById('searchInput'),sr=document.getElementById('searchResults');
si.addEventListener('input',()=>{
  const q=si.value.trim();
  if(!q){sr.classList.remove('open');sr.innerHTML='';return;}
  if(!SEARCH_IDX)buildIdx();
  const hits=[];
  for(const e of SEARCH_IDX){
    const i=e.text.indexOf(q);
    if(i>=0){hits.push({e,i});if(hits.length>=40)break;}
  }
  if(!hits.length){sr.innerHTML='<div class="search-empty">未找到「'+esc(q)+'」相关内容</div>';sr.classList.add('open');return;}
  sr.innerHTML=hits.slice(0,10).map(({e,i})=>{
    const snip=esc(e.text.slice(Math.max(0,i-14),i+26)).replace(esc(q),'<mark>'+esc(q)+'</mark>');
    const args=e.view==='change'
      ? `goSearch('change','${e.comp}',${JSON.stringify(e.types||[]).replace(/"/g,"'")})`
      : `goSearch('spec','${e.spec}',[])`;
    return `<div class="search-item" onclick="${args}"><div class="s-title">${esc(e.title)}</div><div class="s-doc">${esc(e.doc)}</div><div class="s-snip">…${snip}…</div></div>`;
  }).join('');
  sr.classList.add('open');
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))sr.classList.remove('open');});
function goSearch(v,id,types){
  sr.classList.remove('open');si.value='';
  if(v==='change'){cComp=id;cTypes=new Set(types);}
  else{sSpec=id;sOpt={};}
  location.hash='#/'+v;
  if(view()===v)render();
}

/* ============ 渲染入口 ============ */
function render(){
  const v=view();
  content.innerHTML = v==='home'?vHome():v==='change'?vChange():v==='spec'?vSpec():vAbout();
  if(v==='change')updateProg();
}
nav();
</script>
