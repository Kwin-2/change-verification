<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懋略设计部PACK零部件通用技术要求速查</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#EFEDE5; --card:#FFFFFF; --ink:#16150F; --sub:#7A7466; --line:#E7E3D8;
  --acc:#FFC61A; --acc-soft:#FFF4D1; --dark:#1C1C1E;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding:32px 22px 90px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
h1{font-size:30px;font-weight:800;letter-spacing:.5px}
.sub{color:var(--sub);font-size:13.5px;margin-top:6px}
.badge-ver{background:var(--dark);color:#fff;border-radius:999px;padding:7px 18px;font-size:12.5px;font-weight:700;white-space:nowrap}
.layout{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:920px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:none;border-radius:var(--radius);padding:22px 22px;box-shadow:0 2px 14px rgba(30,28,20,.05)}
.card h2{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:14px;letter-spacing:2px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comp-btn{border:1.5px solid var(--line);background:#FBFAF6;border-radius:14px;padding:10px 12px;font-size:13px;cursor:pointer;text-align:left;transition:all .15s;color:var(--ink)}
.comp-btn:hover{border-color:var(--ink)}
.comp-btn.on{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
.lv{font-size:10px;border-radius:999px;padding:2px 7px;font-weight:800}
.lv-A{background:#FFE4DE;color:#C0392B}
.lv-B{background:#FFF1D6;color:#9A6A00}
.lv-C{background:#E2F4EA;color:#237A50}
.lv-AB{background:#F0E6FD;color:#6D28B8}
.chip.on .lv{background:rgba(0,0,0,.12);color:var(--ink)}
.panel-sticky{position:sticky;top:20px}
.hint{font-size:12.5px;color:var(--sub);margin-top:10px}
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.sum-item{background:#fff;border:none;border-radius:18px;box-shadow:0 2px 14px rgba(30,28,20,.05);padding:16px 22px;min-width:140px}
.sum-item b{font-size:30px;font-weight:800;display:block;line-height:1.2}
.sum-item span{font-size:12px;color:var(--sub)}
.sum-level{background:var(--dark);color:#fff}
.sum-level span{color:#B8B3A6}
.sum-level b{font-size:17px;padding-top:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{opacity:.88}
.level-guide{font-size:13.5px;color:#6B5E2E;background:var(--acc-soft);border:none;border-radius:18px;padding:14px 20px;margin-bottom:16px}
.level-guide b{color:var(--ink)}
.cat{background:#fff;border:none;border-radius:var(--radius);box-shadow:0 2px 14px rgba(30,28,20,.05);margin-bottom:14px;overflow:hidden}
.cat-h{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.cat-h b{font-size:16px;font-weight:700}
.cat-h .cnt{font-size:12px;color:var(--sub)}
.cat-h .prog{color:var(--ink);font-weight:700;background:var(--acc-soft);border-radius:999px;padding:2px 10px}
.items{border-top:1.5px solid #F2EEE3;padding:10px 24px 16px}
.item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #F0ECE1;font-size:14px}
.item:last-child{border-bottom:none}
.item input{margin-top:5px;accent-color:var(--dark);width:17px;height:17px;flex:none;cursor:pointer}
.item label{cursor:pointer;flex:1}
.item.done label{color:#B9B2A0;text-decoration:line-through}
.tags{font-size:11px;color:var(--sub);margin-top:2px}
.empty{color:var(--sub);text-align:center;padding:70px 20px;font-size:14px;background:#fff;border-radius:var(--radius)}
footer{margin-top:32px;color:var(--sub);font-size:12px;text-align:center;line-height:2}
@media print{
  body{background:#fff}
  .layout{grid-template-columns:1fr}
  .panel-sticky,.toolbar,header.top .badge-ver{display:none!important}
  .item input{appearance:none;width:13px;height:13px;border:1.5px solid #666;border-radius:3px;margin-top:4px}
  .item input:checked{background:#666}
  .cat{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .wrap{padding:0}
}

.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec-btn{border:1.5px solid var(--line);background:#FBFAF6;border-radius:14px;padding:10px 12px;font-size:13px;cursor:pointer;text-align:left;transition:all .15s;color:var(--ink)}
.spec-btn:hover{border-color:var(--ink)}
.spec-btn.on{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:700}
.fq{margin-bottom:16px}
.fq .q{font-size:13.5px;font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
.doc{background:#fff;border:none;border-radius:var(--radius);box-shadow:0 2px 14px rgba(30,28,20,.05);padding:34px 38px}
.doc h3{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:2px}
.doc .docno{text-align:center;color:var(--sub);font-size:12px;margin-bottom:4px}
.doc .docvar{text-align:center;color:var(--ink);background:var(--acc-soft);border-radius:999px;display:inline-block;padding:4px 16px;font-size:12.5px;margin:6px auto 20px}
.doc .docvar-wrap{text-align:center}
.doc h4{font-size:15.5px;font-weight:800;margin:22px 0 10px;padding-left:12px;border-left:5px solid var(--acc)}
.doc li{margin:6px 0 6px 24px;font-size:14px}
.doc .note{font-size:12px;color:var(--sub);margin-top:22px;border-top:1.5px dashed var(--line);padding-top:12px}
@media print{
  .doc{box-shadow:none;padding:0}
  #gate{display:none!important}
  .doc h4{break-after:avoid}
}

#gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.gate-box{background:#fff;border-radius:26px;padding:46px 44px;text-align:center;width:350px;box-shadow:0 24px 60px rgba(30,28,20,.14)}
.gate-badge{width:52px;height:52px;border-radius:16px;background:var(--acc);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--ink)}
.gate-title{font-size:20px;font-weight:800;color:var(--ink);line-height:1.5}
.gate-sub{font-size:12.5px;color:var(--sub);margin:8px 0 20px}
#gateInput{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:#FBFAF6;border-radius:999px;padding:12px 18px;font-size:15px;outline:none;text-align:center}
#gateInput:focus{border-color:var(--acc)}
#gateBtn{width:100%;margin-top:14px;background:var(--dark);color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#gateBtn:hover{opacity:.88}
.gate-err{display:none;color:#C0392B;font-size:12px;margin-top:12px}
.gate-err.show{display:block}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <div class="gate-badge">M</div>
    <div class="gate-title">懋略设计部PACK零部件<br>通用技术要求速查</div>
    <div class="gate-sub">内部受控工具 · 请输入访问口令</div>
    <input id="gateInput" type="password" placeholder="访问口令" autocomplete="off">
    <button id="gateBtn">进 入</button>
    <div class="gate-err" id="gateErr">口令错误，请重试</div>
  </div>
</div>
<script>
(function(){
  var HASH="c15826220b69f2202555ac408b1ec13cef863ac28175a6890962d3658256286e";
  var gate=document.getElementById('gate');
  if(sessionStorage.getItem('cv_auth')==='1'){gate.remove();return;}
  document.title="访问验证";
  var inp=document.getElementById('gateInput'),err=document.getElementById('gateErr');
  function ok(){sessionStorage.setItem('cv_auth','1');gate.remove();document.title='懋略设计部PACK零部件通用技术要求速查';}
  function bad(){err.classList.add('show');inp.value='';inp.focus();}
  function tryLogin(){
    var v=inp.value;
    if(window.crypto&&crypto.subtle){
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(b){
        var h=[...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,'0')}).join('');
        h===HASH?ok():bad();
      }).catch(function(){v==='Mor'+'lus'?ok():bad();});
    }else{v==='Mor'+'lus'?ok():bad();}
  }
  document.getElementById('gateBtn').onclick=tryLogin;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
  inp.focus();
})();
</script>

评定（PQR），焊工/焊机参数受控；密封焊缝连续，焊接接头强度不低于母材标准值的 80%。", "when": {"proc": ["weld", "ext"]}}, {"text": "搅拌摩擦焊：焊缝无隧道、未焊合缺陷；焊后焊缝区拉伸强度按 GB/T 2651 复验。", "when": {"proc": ["ext"]}}, {"text": "压铸：模具温度/压射参数受控，禁止焊补关键承载与密封区域；去浇口后无残留毛刺。", "when": {"proc": ["cast"]}}, "加工后清洗除油、除铝屑，腔体内无残留异物（集成液冷结构按清洁度要求，参照 ISO 16232）。"]}, {"t": "7  表面处理要求", "items": [{"text": "喷粉：环氧/聚酯粉末，膜厚 60~100μm（GB/T 13452.2）；附着力划格法 0~1 级（GB/T 9286）；耐中性盐雾 ≥500h（GB/T 10125）后附着力复测不低于 1 级。", "when": {"surf": ["powder"]}}, {"text": "电泳：膜厚 15~25μm；附着力 0~1 级；耐中性盐雾 ≥720h 无起泡、无锈蚀蔓延（划叉处单边蔓延≤2mm）。", "when": {"surf": ["ecoat"]}}, {"text": "铝裸材：表面无氧化斑、油污；与涂层件搭接的导电/绝缘区域按图纸遮蔽要求执行。", "when": {"surf": ["bare"]}}, "涂层绝缘区域（如有）：绝缘电阻 ≥100MΩ（500V DC），耐压 2500V DC/60s 无击穿。"]}, {"t": "8  性能要求", "items": ["总成气密性（参与密封时）：按图纸泄漏率要求（典型 ≤10 mbar·L/s 或按整包 IP 要求折算）。", "承载强度：按图纸/技术协议的静强度与刚度要求，加载后无裂纹、无塑性变形超标。", {"text": "焊接接头拉伸强度按 GB/T 2651 试验，不低于设计要求值。", "when": {"proc": ["weld", "ext"]}}, "集成液冷流道：氦检漏 ≤1×10⁻⁵ Pa·m³/s（GB/T 15823），爆破压力 ≥4 倍工作压力。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["中性盐雾：按第7章对应等级执行（GB/T 10125）。", "温度冲击：-40℃~+85℃ 各保温 1h，20 个循环（GB/T 2423.22），试验后无裂纹、涂层无起泡脱落，气密复测合格。", "耐湿热：+85℃/85%RH，240h（GB/T 2423.3），试验后涂层附着力复测 0~1 级。", "振动耐久：随整包按 GB/T 31467.3 / 整车型谱执行，试验后焊缝与连接无裂纹。"]}, {"t": "10  试装与匹配要求", "items": ["与车身、模组、上盖、管路的接口按图纸执行装配验证；吊装点适配产线吊具。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（安装孔位/平面度/密封面）、涂层膜厚、气密（适用时）", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/工艺/场地/模具变更时", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "大型薄壁件包装须防平面度变形，堆码层数按包装方案限定。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "cover", "name": "上盖", "doc_no": "ML-TS-CV-001", "filters": [{"id": "mat", "q": "主体材质", "opts": [{"id": "steel", "label": "钣金（钢/铝）"}, {"id": "smc", "label": "SMC/复合材料"}, {"id": "inj", "label": "注塑工程塑料"}]}, {"id": "surf", "q": "表面处理方式", "opts": [{"id": "powder", "label": "喷粉"}, {"id": "ecoat", "label": "电泳"}, {"id": "none", "label": "无涂层"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包上盖（盖板）类零部件，含金属与非金属材质。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 5213  冷轧低碳钢板及钢带", "GB/T 15568  通用型片状模塑料（SMC）", "GB/T 14486  塑料模塑件尺寸公差", "GB/T 2408  塑料 燃烧性能的测定 水平法和垂直法", "GB/T 9286  划格试验", "GB/T 10125  盐雾试验", "GB/T 1804  一般公差", "GB 38031  电动汽车用动力蓄电池安全要求", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "钣金：冷轧钢板（SPCC/DC01）或铝板（5052/6061），每炉批提供 CoA 并复验。", "when": {"mat": ["steel"]}}, {"text": "SMC/复材：玻纤含量 ≥25%（灼烧法 GB/T 2577），阻燃 UL94 V-0（1.5mm，GB/T 2408），热变形温度 ≥200℃。", "when": {"mat": ["smc"]}}, {"text": "注塑：阻燃增强尼龙/PBT（如 PA66-GF30），阻燃 UL94 V-0（壁厚对应等级），提供粒子牌号证明与 UL 黄卡。", "when": {"mat": ["inj"]}}, "与电解液/冷却液可能接触的部位须提供耐介质声明或试验数据。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": [{"text": "金属件未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916。", "when": {"mat": ["steel"]}}, {"text": "模塑件尺寸公差按 GB/T 14486 相应 MT 等级（图纸标注优先）。", "when": {"mat": ["smc", "inj"]}}, "螺栓孔位位置度 ≤Φ0.4mm；密封面平面度/轮廓度按图纸（典型 ≤0.4mm/m）。"]}, {"t": "5  外观要求", "items": ["无裂纹、缺料、分层、缩痕、飞边；棱边去毛刺；颜色/纹理按签样件。", "密封面无划伤、无涂层堆积。"]}, {"t": "6  加工工艺要求", "items": [{"text": "冲压：折弯半径 ≥1.0t，折弯方向与轧制方向垂直优先；孔边距 ≥1.5t。", "when": {"mat": ["steel"]}}, {"text": "模压/注塑：工艺参数窗口受控，熔接线避开密封面与固定点；顶针印不得凸出密封面。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "7  表面处理要求", "items": [{"text": "喷粉：膜厚 60~100μm，附着力 0~1 级（GB/T 9286），中性盐雾 ≥500h（GB/T 10125）。", "when": {"surf": ["powder"]}}, {"text": "电泳：膜厚 15~25μm，附着力 0~1 级，中性盐雾 ≥720h。", "when": {"surf": ["ecoat"]}}, {"text": "无涂层：表面无氧化、油污；非金属件不适用本章。", "when": {"surf": ["none"]}}, "金属盖与箱体的 EMC 搭接面（如有）按图纸保持导电连续（接触电阻 ≤50mΩ）。"]}, {"t": "8  性能要求", "items": ["总成刚度：按图纸加载要求，残余变形不超标；固定点拉脱强度按图纸。", "整包气密配合：与密封圈/托盘配合后满足整包 IP 等级（GB 38031、GB/T 4208）。", {"text": "非金属盖：阻燃 UL94 V-0；并参与整包热扩散防护验证（GB 38031）。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "9  老化、耐候与耐久要求", "items": ["温度冲击 -40℃~+85℃×20 循环（GB/T 2423.22）后无裂纹、无变形超标，气密配合复测合格。", "湿热 +85℃/85%RH×240h（GB/T 2423.3）后涂层/材料无起泡、附着力 0~1 级。", {"text": "非金属盖：热老化 120℃×500h（GB/T 7141）后拉伸强度保持率 ≥70%。", "when": {"mat": ["smc", "inj"]}}]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（孔位/密封面）、膜厚（适用时）", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/工艺/场地/模具变更时", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "薄壁大平面件防压防变形，竖放或专用料架运输。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "coldplate", "name": "冷板（液冷板）", "doc_no": "ML-TS-CP-001", "filters": [{"id": "proc", "q": "流道成型/连接工艺", "opts": [{"id": "braze", "label": "冲压+钎焊"}, {"id": "fsw", "label": "搅拌摩擦焊"}, {"id": "tube", "label": "口琴管/挤出管"}]}, {"id": "surf", "q": "外表面处理", "opts": [{"id": "bare", "label": "铝裸材"}, {"id": "ins", "label": "绝缘涂层/喷粉"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包液冷板（含流道板、进出水接头）类零部件。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 3880  铝及铝合金轧制板材", "GB/T 6892  挤压型材", "GB/T 15823  氦泄漏检测方法", "GB/T 10125  盐雾试验", "GB/T 2651  焊接接头拉伸试验", "ISO 16232  道路车辆 流体回路部件清洁度", "GB/T 3323  焊缝射线检测", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["铝合金 3003/3003mod/6063 或图纸指定牌号（钎焊板为复合钎料层结构），化学成分按 GB/T 3190，每炉批 CoA。", "钎料/焊丝牌号与母材匹配，提供材质证明。", "与冷却液接触材料须提供相容性数据（50%乙二醇水溶液，88℃×1000h 参照 GB/T 1690 评估）。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；流道截面尺寸按图纸（影响流阻，为关键特性）。", "与模组贴合面平面度 ≤0.3mm/m（图纸优先），粗糙度 Ra≤3.2μm。", "进出水口接口尺寸按图纸/接头匹配规范，位置度 ≤Φ0.5mm。"]}, {"t": "5  外观要求", "items": ["表面无压痕、裂纹、焊渣、毛刺；流道口倒角、无翻边堵塞。", "钎焊缝/搅拌摩擦焊缝外观均匀，无未焊合、气孔、烧穿。"]}, {"t": "6  加工工艺要求", "items": [{"text": "钎焊：钎焊炉温曲线受控（记录可追溯），钎着率按图纸（典型 ≥90%，切片/CT 抽检）。", "when": {"proc": ["braze"]}}, {"text": "搅拌摩擦焊：参数受控，焊缝无隧道缺陷；首件及定期做焊缝拉伸（GB/T 2651）与金相。", "when": {"proc": ["fsw"]}}, "焊后清洗：内腔无钎剂残留、无颗粒物；清洁度按 ISO 16232（颗粒度等级按图纸，典型：最大颗粒 ≤500μm）。", "流道 100% 通流检查（通气/通球），确保无堵塞。"]}, {"t": "7  表面处理要求", "items": [{"text": "铝裸材：表面无氧化斑、油污，贴合面无涂层（保证导热）。", "when": {"surf": ["bare"]}}, {"text": "绝缘涂层/喷粉：膜厚按图纸（典型 50~120μm，过厚影响换热需评估），附着力 0~1 级（GB/T 9286）；耐压 ≥3000V DC/60s、绝缘电阻 ≥500MΩ（1000V DC）；盐雾 ≥500h（GB/T 10125）。", "when": {"surf": ["ins"]}}]}, {"t": "8  性能要求", "items": ["氦检漏：≤1×10⁻⁶ ~ 1×10⁻⁵ Pa·m³/s（GB/T 15823，按图纸），100% 全检。", "爆破压力：≥4 倍最大工作压力，保压无破裂、无永久变形（典型 ≥2.0MPa）。", "耐压脉冲：工作压力 0.1~1.0 倍交变，≥10 万次（或按图纸），试验后检漏合格。", "流阻/压降：在设计流量下实测压降与设计值偏差 ≤±10%（首批必测并固化基准）。", "耐内腐蚀：冷却液 88℃×1000h 循环腐蚀试验后，流道无穿孔，腐蚀深度 ≤0.1mm，检漏合格。", "热阻/换热性能：首批提供实测数据（稳态法，参照 ASTM D5470 或等效方法），作为变更比对基准。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["温度冲击 -40℃~+120℃（进水侧介质温度区间按图纸）×30 循环（GB/T 2423.22），试验后检漏合格。", "振动：随整包 GB/T 31467.3，试验后检漏、压降复测合格。", "外表面盐雾按第7章；接头部位随整包盐雾评估。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、流道口尺寸、氦检漏（全检）、贴合面平面度", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/钎料/工艺/场地变更时（含爆破、脉冲、内腐蚀、流阻全项）", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "管口必须封堵（堵帽/胶带），防止异物进入流道；防压防磕碰。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。", "冷却液相容性声明与内腐蚀数据为 PPAP 必备附件。"]}]}, {"id": "cu_bar", "name": "铜排", "doc_no": "ML-TS-CU-001", "filters": [{"id": "surf", "q": "表面处理方式", "opts": [{"id": "ni", "label": "镀镍"}, {"id": "sn", "label": "镀锡"}, {"id": "bare", "label": "裸铜（无镀层）"}, {"id": "ins", "label": "包塑/浸塑绝缘"}]}, {"id": "proc", "q": "成型工艺", "opts": [{"id": "stamp", "label": "冲压+折弯"}, {"id": "cnc", "label": "铣削加工"}, {"id": "flex", "label": "软连接（铜箔叠层）"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包内铜质导电母排（硬排）及铜软连接，额定电压 ≤1000V DC。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 5231  加工铜及铜合金牌号和化学成分", "GB/T 2040  铜及铜合金板材", "GB/T 2059  铜及铜合金带材", "GB/T 9798  金属覆盖层 镍电沉积层", "GB/T 12599  金属覆盖层 锡电镀层 技术规范和试验方法", "GB/T 5270  金属基体上的金属覆盖层 附着强度试验方法", "GB/T 6462  金属和氧化物覆盖层 厚度测量 显微镜法", "GB/T 16921  金属覆盖层 X射线光谱法测厚", "GB/T 10125  盐雾试验", "GB/T 13914/13915/13916  冲压件尺寸/角度/形位公差", "GB/T 1804  一般公差", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["T2 紫铜（Cu+Ag ≥99.90%，GB/T 5231），板材 GB/T 2040、带材 GB/T 2059；每炉批 CoA。", "导电率 ≥97% IACS（涡流/电桥法实测，首批及变更时）。", {"text": "硬排力学性能：软态 M 抗拉 ≥195MPa、延伸率 ≥30%；半硬 Y2 抗拉 245~345MPa（按 GB/T 2040）。", "when": {"proc": ["stamp", "cnc"]}}, {"text": "软连接：T2 铜箔 0.05~0.3mm 叠层，焊区（扩散焊/分子焊）无虚焊，焊区剥离强度按图纸。", "when": {"proc": ["flex"]}}, "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916 相应等级。", "折弯角度公差 ±0.5°；安装孔径公差 H11（图纸优先）；搭接面平面度 ≤0.1mm/100mm。", "绝缘间隙/爬电距离按图纸（高压区域典型：间隙 ≥5.5mm/爬电 ≥6.3mm @1000V 按污染等级校核，以图纸为准）。"]}, {"t": "5  外观要求", "items": ["表面无裂纹、起皮、压痕、氧化变色；棱边、孔口去毛刺（毛刺 ≤0.1mm）。", "折弯区无裂纹（10 倍放大检查）；镀层色泽均匀、无漏镀、无烧焦。"]}, {"t": "6  加工工艺要求", "items": [{"text": "折弯：最小折弯半径 ≥1.0t（软态）/≥1.5t（硬态），折弯线垂直于轧制方向优先；同一位置禁止重复折弯。", "when": {"proc": ["stamp"]}}, {"text": "铣削：棱边倒角 R0.5±0.2 或按图纸；加工后清洗除屑。", "when": {"proc": ["cnc"]}}, {"text": "软连接：叠层对齐、焊区面积按图纸；软连接段绝缘套管（热缩管）包覆完整。", "when": {"proc": ["flex"]}}, "冲压/铣削后 100% 去毛刺并清洗；成品表面电阻（搭接区域）不得因加工硬化超标。"]}, {"t": "7  表面处理要求", "items": [{"text": "镀镍（GB/T 9798）：镍层厚度 ≥5μm（一般面）/≥8μm（搭接面），厚度按 GB/T 16921（X荧光）或 GB/T 6462 测定；附着力按 GB/T 5270 弯曲/热震法，无起皮脱落；中性盐雾 96h（GB/T 10125）后无基材腐蚀、接触电阻变化 ≤20%。", "when": {"surf": ["ni"]}}, {"text": "镀锡（GB/T 12599）：锡层厚度 ≥5μm（搭接面 ≥8μm）；附着力合格；中性盐雾 48h 后无基材腐蚀；防锡须：雾锡（哑光锡）工艺或按图纸。", "when": {"surf": ["sn"]}}, {"text": "裸铜：表面做防氧化处理（钝化/防变色剂），包装加干燥剂；搭接面接触电阻按图纸（典型 ≤20μΩ）。", "when": {"surf": ["bare"]}}, {"text": "包塑/浸塑（环氧粉末/PA12/PVC）：涂层厚度 0.3~0.8mm，无针孔（电火花检漏 3kV）；附着力划格 0~1 级；耐压 ≥3000V DC/60s 无击穿；绝缘电阻 ≥500MΩ（1000V DC）。", "when": {"surf": ["ins"]}}, "镀层/涂层区域与尺寸按图纸（含遮蔽区域）。"]}, {"t": "8  性能要求", "items": ["温升：额定持续电流下搭接面温升 ≤55K（按 GB/T 5095 或协议方法，首批实测并固化基准）。", "搭接面接触电阻：按图纸（典型 ≤20μΩ/面），首批及表面处理变更时必测。", {"text": "包塑件：耐压 ≥3000V DC/60s、绝缘电阻 ≥500MΩ、局部放电（如要求）按图纸。", "when": {"surf": ["ins"]}}, "载流能力：按图纸截面积核算，首批温升实测验证。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["中性盐雾：镀镍 96h / 镀锡 48h / 裸铜 24h（防变色评估）/ 包塑 96h（GB/T 10125），试验后外观、接触电阻复测合格。", "温度循环 -40℃~+125℃×100 次（GB/T 2423.22），试验后无裂纹、包塑无开裂、接触电阻变化 ≤20%。", "湿热 +85℃/85%RH×240h（GB/T 2423.3），试验后绝缘/耐压复测合格（包塑件）。", "振动：随整包 GB/T 31467.3，试验后连接无松动、接触电阻变化 ≤20%。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、关键尺寸（孔位/折弯角度/平面度）、镀层厚度、接触电阻", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、材料/表面/工艺/场地变更时（含温升、盐雾全项）", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items": ["标识：每件/每最小包装应有零件号、批次号、生产日期、供方代码；批次号应可追溯至原材料批次与生产班次。", "包装应防潮、防尘、防磕碰、防变形；运输中不得淋雨、倒置或野蛮装卸。", "镀层件防氧化防潮包装（干燥剂/防锈袋），禁止裸手接触搭接面。", "储存环境：温度 -10℃~+40℃，相对湿度 ≤70%RH，无腐蚀性气氛；超过储存期的物料须复验合格后使用。"]}, {"t": "14  供方认可与变更管理", "items": ["供方首次供货、材料/工艺/场地/二级供方变更时，须按 PPAP Level 3 提交认可资料（PSW、过程流程图、PFMEA、控制计划、MSA、全尺寸报告、材料报告、性能试验报告）。", "关键特性（KPC）过程能力 Cpk≥1.67（安全特性）/1.33（一般关键特性）；量产中按控制计划维持 SPC 监控。", "未经书面认可，供方不得变更材料、工艺、场地、模具及二级供应商。"]}]}, {"id": "al_bar", "name": "铝排", "doc_no": "ML-TS-AL-001", "filters": [{"id": "surf", "q": "表面处理方式", "opts": [{"id": "ni", "label": "镀镍"}, {"id": "sn", "label": "镀锡"}, {"id": "bare", "label": "裸铝（导电氧化/钝化）"}, {"id": "ins", "label": "包塑/浸塑绝缘"}]}, {"id": "proc", "q": "成型工艺", "opts": [{"id": "stamp", "label": "冲压+折弯"}, {"id": "cnc", "label": "铣削加工"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包内铝质导电母排，额定电压 ≤1000V DC。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3190  铝及铝合金化学成分", "GB/T 3880  铝及铝合金轧制板材", "GB/T 9798  镍电沉积层", "GB/T 12599  锡电镀层", "GB/T 5270  覆盖层附着强度", "GB/T 16921  X荧光测厚", "GB/T 10125  盐雾试验", "GB/T 13914/13915/13916  冲压件公差", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": ["牌号 1060/6101/6063 或图纸指定（GB/T 3190），板材 GB/T 3880；每炉批 CoA。", "导电率：1060 ≥61% IACS、6101-T6 ≥55% IACS（首批实测）；抗拉强度/延伸率按 GB/T 3880 状态要求。", "禁用物质符合 GB/T 30512、RoHS。"]}, {"t": "4  尺寸与公差", "items": ["未注公差 GB/T 1804-m；冲压件按 GB/T 13914/13915/13916。", "折弯角度 ±0.5°；孔径 H11；搭接面平面度 ≤0.1mm/100mm。", "绝缘间隙/爬电距离按图纸。"]}, {"t": "5  外观要求", "items": ["无裂纹、起皮、压痕；去毛刺 ≤0.1mm；折弯区无裂纹（10 倍放大）。", "镀层色泽均匀、无漏镀。"]}, {"t": "6  加工工艺要求", "items": ["最小折弯半径 ≥1.5t（6061-T6 等硬态 ≥2.0t），折弯线垂直于轧制方向优先；禁止重复折弯。", "铝件镀前须专用前处理（沉锌），供方须有铝上电镀合格工艺评定。"]}, {"t": "7  表面处理要求", "items": [{"text": "镀镍（GB/T 9798）：厚度 ≥5μm/搭接面 ≥8μm；附着力 GB/T 5270 合格；中性盐雾 96h 无基材腐蚀（GB/T 10125）。", "when": {"surf": ["ni"]}}, {"text": "镀锡（GB/T 12599）：厚度 ≥5μm；附着力合格；中性盐雾 48h 无基材腐蚀。", "when": {"surf": ["sn"]}}, {"tex 、模具及二级供应商。", "PPAP 须附：器件清单（含 AEC-Q 声明）、烧录追溯方案、EMC 报告、软件版本发布记录。"]}]}, {"id": "fastener", "name": "紧固件（螺栓/螺母/铆接件）", "doc_no": "ML-TS-FA-001", "filters": [{"id": "grade", "q": "强度等级", "opts": [{"id": "g88", "label": "8.8级及以下"}, {"id": "g109", "label": "10.9级"}, {"id": "g129", "label": "12.9级"}]}, {"id": "surf", "q": "表面处理方式", "opts": [{"id": "dacro", "label": "达克罗/锌铝涂层"}, {"id": "zn", "label": "电镀锌"}, {"id": "znn", "label": "电镀锌镍"}, {"id": "phos", "label": "磷化/发黑"}]}], "sections": [{"t": "1  范围", "items": ["本文件适用于电池包用金属紧固件（螺栓、螺钉、螺母、铆螺母、拉铆钉等）。", "本文件规定的技术要求为该类物料的通用底线要求；图纸、数模、双方技术协议中有更严要求时，从其要求。", "本文件所引用的标准均以现行有效版本为准。"]}, {"t": "2  规范性引用文件", "items": ["GB/T 3098.1  紧固件机械性能 螺栓、螺钉和螺柱", "GB/T 3098.2  紧固件机械性能 螺母", "GB/T 3098.17  紧固件 检查氢脆用预载荷试验", "GB/T 3103.1  紧固件公差", "GB/T 16823.3  紧固件 扭矩-夹紧力试验", "GB/T 10431  紧固件横向振动试验方法（防松）", "GB/T 5267.1  紧固件 电镀层", "GB/T 10125  盐雾试验", "GB/T 90.1/90.2  紧固件验收检查、标志与包装", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "8.8级及以下：碳钢/合金钢（如 35#/45#/ML35），按 GB/T 3098.1 力学性能。", "when": {"grade": ["g88"]}}, {"text": "10.9级：合金钢（如 SCM435/42CrMo），按 GB/T 3098.1；回火温度 ≥425℃。", "when": {"grade": ["g109"]}}, {"text": "12.9级：合金钢，按 GB/T 3098.1；必须有热处理炉批记录与硬度全检记录。", "when": {"grade": ["g129"]}}, "每炉批提供材质报告（光谱）+ 力学性能报告（拉伸、硬度、金相：脱碳层深度、晶粒度）。", "禁用物质符合 GB/T 30512、RoHS（电镀层六价铬禁用，采用三价铬钝化或无铬涂层）。"]}, {"t": "4  尺寸与公差", "items": ["尺寸公差按 GB/T 3103.1 A 级（或图纸）；螺纹精度 6g/6H（镀前/镀后通止规检验）。"]}, {"t": "5  外观要求", "items": ["螺纹无乱扣、磕伤；头部无裂纹（头部成形裂纹按 GB/T 5779 验收）；表面无锈蚀、镀层无起皮。"]}, {"t": "6  加工工艺要求", "items": ["冷镦/温镦成形，滚丝（搓丝）在热处理后或按工艺评定执行；", {"text": "≥10.9级：热处理炉温记录可追溯；磨削/滚压工艺防氢脆引入。", "when": {"grade": ["g109", "g129"]}}]}, {"t": "7  表面处理要求", "items": [{"text": "达克罗/锌铝涂层：涂层厚度 ≥8μm；中性盐雾 ≥720h 无红锈（GB/T 10125）；摩擦系数范围按图纸（典型 0.09~0.15）。", "when": {"surf": ["dacro"]}}, {"text": "电镀锌（GB/T 5267.1，三价铬钝化）：锌层 ≥8μm；中性盐雾 ≥240h 无红锈；摩擦系数 0.10 28  硫化橡胶拉伸应力应变性能", "GB/T 7759  压缩永久变形", "GB/T 3512  热空气老化", "GB/T 7762  耐臭氧老化", "GB/T 1690  耐液体", "GB/T 1682  低温脆性", "GB/T 3672.1  橡胶制品公差", "GB/T 2423（系列）", "GB/T 2828.1  计数抽样检验程序（按接收质量限AQL检索）", "GB/T 30512  汽车禁用物质要求", "GB/T 26125  电子电气产品六种限用物质（RoHS）的测定", "GB/T 4857（系列）  包装 运输包装件基本试验", "GB/T 2423（系列）  环境试验（低温/高温/湿热/温度变化/振动/盐雾等）"]}, {"t": "3  材料要求", "items": [{"text": "EPDM：耐候耐臭氧优，适用温度 -40℃~+120℃；硬度 50±5 Shore A（或按图纸）。", "when": {"mat": ["epdm"]}}, {"text": "硅橡胶 VMQ：高低温优，-55℃~+200℃；硬度按图纸；抗撕裂强度 ≥20kN/m。", "when": {"mat": ["vmq"]}}, {"text": "氟橡胶 FKM：耐介质优（电解液/油），-20℃~+200℃；用于介质接触部位。", "when": {"mat": ["fkm"]}}, "胶料每批 CoA：硬度、拉伸强度、断裂伸长率、压缩永久变形；混炼胶批次可追溯。", "禁限用物质符合 RoHS/REACH。"]}, {"t": "4  尺寸与公差", "items": ["截面尺寸公差按 GB/T 3672.1 M2 级（图纸优先）；O形圈按 GB/T 3452.1。", "内径/外形尺寸按图纸；接头（接角）处尺寸过渡平滑，无台阶。"]}, {"t": "5  外观要求", "items": ["无气泡、缺胶、杂质、飞边超限（飞边 ≤0.15mm）；", {"text": "接角处：平整、无溢胶、无开裂，接头强度按第8章。", "when": {"proc": ["extr"]}}]}, {"t": "6  加工工艺要求", "items": ["混炼胶批次管理；硫化温度/时间受控（硫化仪曲线监控）。", {"text": "模压：模具分型面错位 ≤0.1mm。", "when": {"proc": ["mold"]}}, {"text": "接角：模压接角，接角胶料与本体同材质；接角后 100% 外观+拉伸抽检。", "when": {"proc": ["extr"]}}]}, {"t": "8  性能要求", "items": ["压缩永久变形（GB/T 7759）：+85℃×72h×25% 压缩后 ≤25%（EPDM）/ 按材质图纸值；+125℃ 工况按图纸。", "压缩反力（压缩率-力曲线）：按设计区间（密封圈压缩率典型 20%~35%），首批固化基准曲线。", "拉伸强度 ≥10MPa、断裂伸长率 ≥250%（GB/T 528，EPDM 典型值，按材质/图纸）。", "硬度 50±5 Shore A（GB/T 531.1，或按图纸）。", {"text": "接角接头拉伸强度 ≥本体 70%。", "when": {"proc": ["extr"]}}, "低温脆性：-40℃ 无裂纹（GB/T 1682）。"]}, {"t": "9  老化、耐候与耐久要求", "items": ["热空气老化（GB/T 3512）：+100℃×500h 后硬度变化 ≤±10、拉伸强度保持率 ≥75%、断裂伸长率保持率 ≥60%。", "耐臭氧（GB/T 7762）：50pphm×40℃×72h×20% 拉伸，无裂纹。", "耐冷却液/电解液（GB/T 1690）：浸泡 240h 后体积变化 ≤±10%、硬度变化 ≤±10。", "温度循环 -40℃~+105℃×50 次后压缩永久变形复测合格；随整包气密复测合格。"]}, {"t": "11  检验规则", "items": ["检验分为出厂检验（每批）与型式试验（全项）。", "出厂检验项目：外观、截面尺寸、硬度、压缩反力抽检", "出厂检验抽样：按 GB/T 2828.1 一般检验水平Ⅱ，关键特性 AQL=0.4，主要特性 AQL=1.0，次要特性 AQL=2.0；安全/法规特性全检。", "型式试验时机：首次供货、每年一次、胶料/工艺/场地/模具变更时（含老化、耐介质全项）", "型式试验样品：≥3件，从正常生产批次中随机抽取；任一项不合格则判型式试验不合格，须整改后重新进行。"]}, {"t": "13  标识、包装、运输与储存", "items let selSpec=null, selOpt={};

const grid=document.getElementById('specGrid'), fcard=document.getElementById('filterCard'),
      fbox=document.getElementById('filterBox'), result=document.getElementById('result');

DATA.specs.forEach(sp=>{
  const b=document.createElement('button');
  b.className='spec-btn'; b.textContent=sp.name; b.dataset.id=sp.id;
  b.onclick=()=>{ selSpec=sp.id; selOpt={};
    document.querySelectorAll('.spec-btn').forEach(x=>x.classList.toggle('on',x.dataset.id===sp.id));

function cur(){ return DATA.specs.find(s=>s.id===selSpec); }

    div.innerHTML='<div class="q">'+f.q+'</div>';
    const row=document.createElement('div'); row.className='opts';
    f.opts.forEach(o=>{
      const t=document.createElement('span'); t.className='opt'; t.textContent=o.label;
      t.onclick=()=>{ selOpt[f.id]=o.id;
        row.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); t.classList.add('on');
        render(); };
      row.appendChild(t);
    });
    div.appendChild(row); fbox.appendChild(div);
  });
}

function match(when){
  if(!when) return true;
  for(const k in when){ if(!selOpt[k] || when[k].indexOf(selOpt[k])<0) return false; }
  return true;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function render(){
  const sp=cur();
  if(!sp){ result.innerHTML='<div class="empty">👈 请先选择左侧的物料分类</div>'; return; }
  // 未选完的筛选提示
  const missing=(sp.filters||[]).filter(f=>!selOpt[f.id]);
  let varTxt = (sp.filters||[]).map(f=>{
    const o=f.opts.find(x=>x.id===selOpt[f.id]);
    return f.q+'：'+(o?o.label:'<span style="color:#d64545">未选择</span>');
  }).join('；');

  let body='';
  let clauseIdx=0;
  sp.sections.forEach(s=>{
    const items=s.items.filter(it=> typeof it==='string' ? true : match(it.when));
    if(!items.length) return;
    body+='<h4>'+esc(s.t)+'</h4><ol style="padding-left:0;list-style-position:inside">';
    items.forEach(it=>{
      const t= typeof it==='string' ? it : it.text;
      clauseIdx++;
      body+='<li>'+esc(t)+'</li>';
    });
    body+='</ol>';
  });

  result.innerHTML =
   '<div class="toolbar">'
   +'<button class="btn primary" onclick="window.print()">🖨 打印 / 另存 PDF</button>'
   +'<button class="btn" id="copyBtn">📋 复制技术要求全文</button>'
   +'</div>'
   +'<div class="doc" id="doc">'
   +'<h3>产品技术要求</h3>'
   +'<div class="docno">'+sp.doc_no+' · 版本 V1.0 · 密级：内部受控</div>'
   +'<div class="docvar-wrap"><div class="docvar">'+sp.name+(varTxt?'<br>'+varTxt:'')+'</div></div>'
   +(missing.length?'<div style="text-align:center;color:#d64545;font-size:13px;margin-bottom:10px">⚠ 还有 '+missing.length+' 个变型条件未选择，下方仅显示通用条款，选完后自动补齐</div>':'')
   +body
   +'<div class="note">说明：本技术要求为该类物料的通用底线要求；所引用标准以现行有效版本为准；图纸、数模、技术协议中有更严要求时，从其要求。</div>'
   +'</div>';
  document.getElementById('copyBtn').onclick=()=>copyText(sp, varTxt);
}

function copyText(sp, varTxt){
  const doc=document.getElementById('doc');
  let txt='产品技术要求\n'+sp.doc_no+' · V1.0 · 内部受控\n'+sp.name+'\n'
        + varTxt.replace(/<[^>]+>/g,'') + '\n\n';
  doc.querySelectorAll('h4').forEach(h=>{
    txt+=h.textContent+'\n';
    let el=h.nextElementSibling;
    if(el){ el.querySelectorAll('li').forEach((li,i)=>{ txt+=(i+1)+'. '+li.textContent+'\n'; }); }
    txt+='\n';
  });
  txt+='说明：本技术要求为该类物料的通用底线要求；所引用标准以现行有效版本为准；图纸、数模、技术协议中有更严要求时，从其要求。\n';
  navigator.clipboard.writeText(txt).then(()=>alert('技术要求全文已复制，可粘贴到微信/邮件/Word'));
}
</script>
</body>
</html>
